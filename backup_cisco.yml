---
- name: Backup Cisco Switch Configuration
  hosts: cisco_switches
  gather_facts: no
  connection: network_cli

  tasks:
    - name: Collect running config from the switch
      cisco.ios.ios_config:
        backup: yes
      register: config_backup

    - name: Save the backup to a local file
      copy:
        content: "{{ config_backup.backup_path }}"
        dest: "./backups/{{ inventory_hostname }}-running-config.txt"
